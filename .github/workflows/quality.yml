name: Quality checks

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter analyze and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test

  flutter-integration:
    name: Flutter integration on Windows
    runs-on: windows-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter test integration_test/catalog_flow_test.dart -d windows

  angular:
    name: Angular build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: angular_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: angular_app/package-lock.json
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - name: Configure Chrome for the GitHub runner
        run: |
          wrapper="$RUNNER_TEMP/chrome-no-sandbox"
          printf '#!/usr/bin/env bash\nexec "%s" --no-sandbox "$@"\n' "${{ steps.chrome.outputs.chrome-path }}" > "$wrapper"
          chmod +x "$wrapper"
          echo "CHROME_BIN=$wrapper" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: angular-coverage
          path: angular_app/coverage/
