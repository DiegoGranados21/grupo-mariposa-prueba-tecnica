name: Quality checks

on:
  push:
  pull_request:

jobs:
  flutter:
    name: Flutter analyze and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  angular:
    name: Angular build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: angular_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: angular_app/package-lock.json
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - name: Configure Chrome for the GitHub runner
        run: |
          wrapper="$RUNNER_TEMP/chrome-no-sandbox"
          printf '#!/usr/bin/env bash\nexec "%s" --no-sandbox "$@"\n' "${{ steps.chrome.outputs.chrome-path }}" > "$wrapper"
          chmod +x "$wrapper"
          echo "CHROME_BIN=$wrapper" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run build
      - run: npm test
